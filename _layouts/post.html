---
layout: default
---
<section class="max-w-3xl mx-auto px-6 pt-20 pb-12">
    <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mb-4 text-sm">
        <span class="font-mono text-stone-400">{{ page.date | date: "%Y.%m.%d" }}</span>
        {% if page.categories contains 'maintenance' or page.categories contains 'maintainance' %}
        <span class="text-stone-400">· 점검 공지</span>
        {% elsif page.categories contains 'etc' %}
        <span class="text-stone-400">· 기타</span>
        {% endif %}
    </div>
    <h1 class="text-3xl md:text-4xl font-bold text-stone-900 tracking-tight leading-snug">{{ page.title }}</h1>
</section>

<section class="border-t border-stone-200">
    <div class="max-w-3xl mx-auto px-6 py-12">
        <article class="max-w-none text-stone-700 leading-relaxed
            [&_p]:mb-6
            [&_h1]:text-2xl [&_h1]:font-bold [&_h1]:text-stone-900 [&_h1]:mt-10 [&_h1]:mb-4
            [&_h2]:text-xl [&_h2]:font-bold [&_h2]:text-stone-900 [&_h2]:mt-12 [&_h2]:mb-4
            [&_h3]:text-lg [&_h3]:font-semibold [&_h3]:text-stone-900 [&_h3]:mt-8 [&_h3]:mb-3
            [&_h4]:text-base [&_h4]:font-semibold [&_h4]:text-stone-900 [&_h4]:mt-6 [&_h4]:mb-2
            [&_strong]:font-semibold [&_strong]:text-stone-900
            [&_ul]:list-disc [&_ul]:pl-6 [&_ul]:mb-6
            [&_ol]:list-decimal [&_ol]:pl-6 [&_ol]:mb-6
            [&_li]:mb-1.5
            [&_li>ul]:mt-1.5 [&_li>ul]:mb-1.5
            [&_li>ol]:mt-1.5 [&_li>ol]:mb-1.5
            [&_a]:text-accent hover:[&_a]:underline
            [&_blockquote]:border-l-2 [&_blockquote]:border-stone-300 [&_blockquote]:pl-4 [&_blockquote]:mb-6 [&_blockquote]:text-stone-500
            [&_hr]:border-stone-200 [&_hr]:my-10
            [&_img]:rounded-md [&_img]:border [&_img]:border-stone-200 [&_img]:my-8
            [&_code]:font-mono [&_code]:text-[0.875em] [&_code]:bg-stone-100 [&_code]:text-stone-800 [&_code]:px-1.5 [&_code]:py-0.5 [&_code]:rounded
            [&_pre]:bg-stone-50 [&_pre]:border [&_pre]:border-stone-200 [&_pre]:rounded-md [&_pre]:p-4 [&_pre]:mb-6 [&_pre]:overflow-x-auto
            [&_pre_code]:bg-transparent [&_pre_code]:p-0
            [&_table]:w-full [&_table]:mb-6 [&_table]:border-collapse [&_table]:text-sm
            [&_th]:border-b [&_th]:border-stone-300 [&_th]:py-2.5 [&_th]:pr-4 [&_th]:text-left [&_th]:font-semibold [&_th]:text-stone-900
            [&_td]:border-b [&_td]:border-stone-200 [&_td]:py-2.5 [&_td]:pr-4">

            {{ content }}

        </article>

        <div class="mt-14 pt-8 border-t border-stone-200">
            <a href="{{ '/posts/' | relative_url }}" class="text-[15px] font-medium text-accent hover:underline">← 공지사항 목록으로</a>
        </div>
    </div>
</section>
